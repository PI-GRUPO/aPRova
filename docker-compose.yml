name: aprova

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aprova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aprova
      POSTGRES_PASSWORD: aprova
      POSTGRES_DB: aprova
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprova -d aprova"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aprova-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  n8n-aprova:
    profiles: ["automacao"]
    image: n8nio/n8n
    ports:
      - "127.0.0.1:${N8N_PORTA_LOCAL:-5978}:5678"
    volumes:
      - ./.n8n:/home/node/.n8n
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_EDITOR_BASE_URL: ${N8N_URL_BASE:-http://localhost:5978/}
      N8N_WEBHOOK_URL: ${N8N_URL_BASE:-http://localhost:5978/}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      N8N_SEGREDO_ACOES: ${N8N_SEGREDO_ACOES}
      N8N_SEGREDO_EVENTOS: ${N8N_SEGREDO_EVENTOS:-}
      APROVA_API_URL: ${APROVA_API_URL:-http://host.docker.internal:8080}
      SLACK_INCOMING_WEBHOOK_URL: ${SLACK_INCOMING_WEBHOOK_URL:-}
      APROVA_SLACK_WORKFLOW_ID: ${APROVA_SLACK_WORKFLOW_ID:-}
      APROVA_OSV_WORKFLOW_ID: ${APROVA_OSV_WORKFLOW_ID:-}
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  dados-postgres:
  dados-redis:
