name: aprova

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aprova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aprova
      POSTGRES_PASSWORD: aprova
      POSTGRES_DB: aprova
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprova -d aprova"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aprova-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  n8n-aprova:
    profiles: ["automacao"]
    image: n8nio/n8n
    ports:
      - "127.0.0.1:${N8N_PORTA_LOCAL:-5978}:5678"
    volumes:
      - ./.n8n:/home/node/.n8n
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_EDITOR_BASE_URL: ${N8N_URL_BASE:-http://localhost:5978/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL_PUBLICA:-${N8N_URL_BASE:-http://localhost:5978/}}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_GITHUB_VINCULOS: ${SLACK_GITHUB_VINCULOS:-}
      N8N_SEGREDO_ACOES: ${N8N_SEGREDO_ACOES}
      N8N_SEGREDO_EVENTOS: ${N8N_SEGREDO_EVENTOS:-}
      APROVA_API_URL: ${APROVA_API_URL:-http://host.docker.internal:8080}
      APROVA_CHAT_INSTALLATION_ID: ${APROVA_CHAT_INSTALLATION_ID:-0}
      APROVA_CONSULTA_SEMANAL_WORKFLOW_ID: ${APROVA_CONSULTA_SEMANAL_WORKFLOW_ID:-}
      APROVA_SLACK_TEAM_ID: ${APROVA_SLACK_TEAM_ID:-}
      APROVA_SLACK_APP_ID: ${APROVA_SLACK_APP_ID:-}
      APROVA_SLACK_CANAL_CONSULTAS_ID: ${APROVA_SLACK_CANAL_CONSULTAS_ID:-}
      SLACK_INCOMING_WEBHOOK_URL: ${SLACK_INCOMING_WEBHOOK_URL:-}
      APROVA_SLACK_WORKFLOW_ID: ${APROVA_SLACK_WORKFLOW_ID:-}
      APROVA_OSV_WORKFLOW_ID: ${APROVA_OSV_WORKFLOW_ID:-}
      APROVA_TRELLO_WORKFLOW_ID: ${APROVA_TRELLO_WORKFLOW_ID:-}
      APROVA_FEEDBACK_WORKFLOW_ID: ${APROVA_FEEDBACK_WORKFLOW_ID:-}
      APROVA_ONBOARDING_WORKFLOW_ID: ${APROVA_ONBOARDING_WORKFLOW_ID:-}
      APROVA_TRELLO_QUADRO_ID: ${APROVA_TRELLO_QUADRO_ID:-}
      APROVA_TRELLO_QUADRO_NOME: ${APROVA_TRELLO_QUADRO_NOME:-Quadro da equipe}
      APROVA_SLACK_CANAL_ONBOARDING_ID: ${APROVA_SLACK_CANAL_ONBOARDING_ID:-}
      APROVA_ONBOARDING_TRELLO_HABILITADO: ${APROVA_ONBOARDING_TRELLO_HABILITADO:-false}
      APROVA_ONBOARDING_SLACK_HABILITADO: ${APROVA_ONBOARDING_SLACK_HABILITADO:-false}
      APROVA_GITHUB_CHECK_NOME: ${APROVA_GITHUB_CHECK_NOME:-}
      APROVA_GITHUB_CHECK_APP_ID: ${APROVA_GITHUB_CHECK_APP_ID:-}
      # Configuração temporária do quadro usado nos testes locais.
      # O workflow atual exige os sete IDs; os nomes têm valores padrão.
      # Em produção com múltiplas equipes, os vínculos deverão ser configurados por instalação/quadro, sem depender de variáveis globais.
      APROVA_TRELLO_LISTA_BACKLOG_ID: ${APROVA_TRELLO_LISTA_BACKLOG_ID:-}
      APROVA_TRELLO_LISTA_BACKLOG_NOME: ${APROVA_TRELLO_LISTA_BACKLOG_NOME:-Backlog}
      APROVA_TRELLO_LISTA_DESIGN_ID: ${APROVA_TRELLO_LISTA_DESIGN_ID:-}
      APROVA_TRELLO_LISTA_DESIGN_NOME: ${APROVA_TRELLO_LISTA_DESIGN_NOME:-Design}
      APROVA_TRELLO_LISTA_A_FAZER_ID: ${APROVA_TRELLO_LISTA_A_FAZER_ID:-}
      APROVA_TRELLO_LISTA_A_FAZER_NOME: ${APROVA_TRELLO_LISTA_A_FAZER_NOME:-A Fazer}
      APROVA_TRELLO_LISTA_EM_ANDAMENTO_ID: ${APROVA_TRELLO_LISTA_EM_ANDAMENTO_ID:-}
      APROVA_TRELLO_LISTA_EM_ANDAMENTO_NOME: ${APROVA_TRELLO_LISTA_EM_ANDAMENTO_NOME:-Em andamento}
      APROVA_TRELLO_LISTA_REVISAO_ID: ${APROVA_TRELLO_LISTA_REVISAO_ID:-}
      APROVA_TRELLO_LISTA_REVISAO_NOME: ${APROVA_TRELLO_LISTA_REVISAO_NOME:-Revisão de código}
      APROVA_TRELLO_LISTA_TESTE_ID: ${APROVA_TRELLO_LISTA_TESTE_ID:-}
      APROVA_TRELLO_LISTA_TESTE_NOME: ${APROVA_TRELLO_LISTA_TESTE_NOME:-Fase de teste}
      APROVA_TRELLO_LISTA_CONCLUIDO_ID: ${APROVA_TRELLO_LISTA_CONCLUIDO_ID:-}
      APROVA_TRELLO_LISTA_CONCLUIDO_NOME: ${APROVA_TRELLO_LISTA_CONCLUIDO_NOME:-Concluído}
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  dados-postgres:
  dados-redis:
