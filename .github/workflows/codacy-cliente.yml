name: codacy-cliente

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VERSAO_GOLANGCI_LINT: "v2.13.2"
  VERSAO_GOSEC: "v2.30.0"
  VERSAO_STATICCHECK: "v0.8.2"
  VERSAO_CONVERSOR_GOLANGCI_LINT: "0.0.9"
  SHA256_CONVERSOR_GOLANGCI_LINT: "415081dfae5e8f7f6096f0e46a8ce87b2e45382d6eadba66fc774c7002366cb0"
  VERSAO_CONVERSOR_GOSEC: "1.0.6"
  SHA256_CONVERSOR_GOSEC: "7c32131774195d22e16c89f56ae560eca1880225d652621d564d0d55aee61ad5"
  VERSAO_CONVERSOR_STATICCHECK: "3.0.22"
  SHA256_CONVERSOR_STATICCHECK: "35c5733094da8931bf903dcf99b5980c646c3f8fddc4fba992cf06d51eb8f74e"
  CODACY_ANALYSIS_CLI_VERSION: "7.10.4"
  SHA256_SCRIPT_DO_CLI: "76e958c3dd7bc2491b6d3261fece4a118516986e07c8e5e5daa2e59c0a701e16"

jobs:
  envio:
    name: envio
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: conferir o token do Codacy
        id: token
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::warning::CODACY_PROJECT_TOKEN ausente: nenhum resultado é enviado ao Codacy"
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout (actions/checkout v4.4.0)
        if: steps.token.outputs.pronto == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: instalar Go (actions/setup-go v5.6.0)
        if: steps.token.outputs.pronto == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: instalar golangci-lint (golangci/golangci-lint-action v8.0.0)
        if: steps.token.outputs.pronto == 'true'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: ${{ env.VERSAO_GOLANGCI_LINT }}
          install-only: true

      - name: preparar a pasta do envio
        if: steps.token.outputs.pronto == 'true'
        run: echo "PASTA_CODACY=${RUNNER_TEMP}/codacy" >> "$GITHUB_ENV"

      - name: GolangCI-Lint
        if: steps.token.outputs.pronto == 'true'
        run: |
          scripts/codacy-cliente.sh baixar codacy-golangci-lint "$VERSAO_CONVERSOR_GOLANGCI_LINT" "$SHA256_CONVERSOR_GOLANGCI_LINT"
          golangci-lint run --issues-exit-code 0 --output.json.path "${PASTA_CODACY}/golangci-lint.json" ./...
          scripts/codacy-cliente.sh converter codacy-golangci-lint "${PASTA_CODACY}/golangci-lint.json" "${PASTA_CODACY}/golangci-lint.codacy.json"
          scripts/codacy-cliente.sh enviar "${PASTA_CODACY}/golangci-lint.codacy.json"

      - name: Gosec
        if: steps.token.outputs.pronto == 'true'
        run: |
          scripts/codacy-cliente.sh baixar codacy-gosec "$VERSAO_CONVERSOR_GOSEC" "$SHA256_CONVERSOR_GOSEC"
          go install "github.com/securego/gosec/v2/cmd/gosec@${VERSAO_GOSEC}"
          gosec -no-fail -fmt json -out "${PASTA_CODACY}/gosec.json" ./...
          scripts/codacy-cliente.sh converter codacy-gosec "${PASTA_CODACY}/gosec.json" "${PASTA_CODACY}/gosec.codacy.json"
          scripts/codacy-cliente.sh enviar "${PASTA_CODACY}/gosec.codacy.json"

      - name: Staticcheck
        if: steps.token.outputs.pronto == 'true'
        run: |
          scripts/codacy-cliente.sh baixar codacy-staticcheck "$VERSAO_CONVERSOR_STATICCHECK" "$SHA256_CONVERSOR_STATICCHECK"
          go install "honnef.co/go/tools/cmd/staticcheck@${VERSAO_STATICCHECK}"
          staticcheck -f json ./... > "${PASTA_CODACY}/staticcheck.json" || [ $? -eq 1 ]
          scripts/codacy-cliente.sh converter codacy-staticcheck "${PASTA_CODACY}/staticcheck.json" "${PASTA_CODACY}/staticcheck.codacy.json"
          scripts/codacy-cliente.sh enviar "${PASTA_CODACY}/staticcheck.codacy.json"

      - name: baixar o Codacy Analysis CLI
        if: steps.token.outputs.pronto == 'true'
        run: |
          curl -sSfL -o "${PASTA_CODACY}/codacy-analysis-cli.sh" \
            "https://raw.githubusercontent.com/codacy/codacy-analysis-cli/${CODACY_ANALYSIS_CLI_VERSION}/bin/codacy-analysis-cli.sh"
          echo "${SHA256_SCRIPT_DO_CLI}  ${PASTA_CODACY}/codacy-analysis-cli.sh" | sha256sum --check --strict
          chmod +x "${PASTA_CODACY}/codacy-analysis-cli.sh"

      - name: Aligncheck e Deadcode
        if: steps.token.outputs.pronto == 'true'
        run: |
          for ferramenta in aligncheck deadcode; do
            "${PASTA_CODACY}/codacy-analysis-cli.sh" analyze \
              --tool "$ferramenta" \
              --commit-uuid "$COMMIT" \
              --project-token "$CODACY_PROJECT_TOKEN" \
              --upload \
              --skip-commit-uuid-validation \
              --skip-uncommitted-files-check \
              --max-allowed-issues 2147483647
          done

      - name: finalizar a análise no Codacy
        if: always() && steps.token.outputs.pronto == 'true'
        run: scripts/codacy-cliente.sh finalizar
